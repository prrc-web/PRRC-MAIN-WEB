      import React from 'react';
      import { useRouter } from 'next/router';
      import { ADMIN_ROUTES } from '@/lib/config';

      export default function Footer() {
        const router = useRouter();

        const routeToAdministraionPage = () => {
          router.push(ADMIN_ROUTES.FRONTEND_ADMIN);
        };

        const routeToStaffPage = () => {
          router.push('/StaffPage');
        };

        const routeToEducationPage = () => {
          router.push('/EducationPage');
        };

        const routeToPublicationsPage = () => {
          router.push('/PublicationsPage');
        };

        const routeToResearchPage = () => {
          router.push('/ResearchPage');
        };

        const routeToSafetyPage = () => {
          router.push('/SafetyPage');
        };

        return (
          <footer className="bg-gray-900 dark:bg-gray-900 light:bg-gray-900 border-b border-gray-200">
            <div className="mx-auto max-w-screen-xl px-4 pt-16 pb-6 sm:px-6 lg:px-8">
              <div className="lg:flex lg:items-center lg:justify-between">
                <div className="flex justify-start text-teal-600 sm:justify-start">
                  <a
                    href="https://www.prrc.nmt.edu/"
                    className="mt-4 max-w-85 text-center leading-relaxed dark:text-white sm:text-left lg:mt-0">
                    <img src="/PRRClogoLightoldtransparent.png" alt="PRRClogo" />
                  </a>
                </div>

                <div className=" mt-4 max-w-md text-center leading-relaxed sm:text-left lg:mt-0">
                  <h3 className="text-2xl font-medium text-monochrome2">
                    Petroleum Recovery Research Center
                  </h3>
                  <p className="text-lg text-white text-center">
                    A Division of New Mexico Tech
                  </p>
