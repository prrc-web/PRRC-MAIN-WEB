      import React from 'react';

      interface AdminProfileProps {
        name: string;
        title: string;
        imageUrl: string;
        phone: string;
        email: string;
        office: string;
        resumeLink?: string;
        description: string;
      }

      const AdminProfile: React.FC<AdminProfileProps> = ({
        name,
        title,
        imageUrl,
        phone,
        email,
        office,
        resumeLink,
        description,
      }) => {
        const openPDF = (pdfPath: string) => {
          window.open(pdfPath, '_blank');
        };

        return (
          <div className="flex justify-center my-8 md:my-10">
            <div className="flex flex-col md:flex-row w-full max-w-6xl mt-32">
