    content: |
      # Global System Specification

      ## Overview

      This document outlines the high-level architecture and requirements for the entire PRRC web platform.

      ## Modules

      - **Application**: `prrc-next-app` (Next.js 15 with integrated Payload CMS 3.0)
      - **Infrastructure**: Docker, Nginx, MongoDB

      ## Global Architecture

      ### High-Level Overview

      The application uses a **monolithic architecture** with Payload CMS 3.0 integrated directly into the Next.js 15 App Router, orchestrated via Docker Compose.

      ```
      ┌─────────────────────────────────────────────────────────────────┐
      │                         USER'S BROWSER                          │
      │                    http://localhost:3000                        │
      └────────────────────────────┬────────────────────────────────────┘
                                   │
                                   │ HTTP Requests
                                   │
                                   ▼
      ┌─────────────────────────────────────────────────────────────────┐
      │                     NGINX REVERSE PROXY                         │
      │                    Container: prrc-nginx                        │
      │                      Port: 80 (→ 3000)                          │
      │                                                                 │
      │  Routes all traffic to Next.js application                     │
      │  - Frontend pages                                               │
      │  - API requests                                                 │
      │  - Admin panel                                                  │
      └────────────────────────────┬────────────────────────────────────┘
                                   │
                                   │ Proxied to internal port 3000
                                   │
                                   ▼
      ┌─────────────────────────────────────────────────────────────────┐
      │              NEXT.JS 15 APPLICATION (Monolith)                  │
      │           Container: prrc-nextjs-frontend                       │
      │                  Internal Port: 3000                            │
      │                                                                 │
      │  ┌───────────────────────────────────────────────────────────┐ │
      │  │                                                           │ │
      │  │              INTEGRATED PAYLOAD CMS                       │ │
      │  │           (Running inside Next.js)                        │ │
      │  │                                                           │ │
      │  │  Configuration: /prrc-next-app/payload.config.ts         │ │
      │  │  Admin Routes: /app/(payload)/admin/[[...segments]]      │ │
      │  │  API Routes: /api/* (Payload REST API)                   │ │
      │  │                                                           │ │
      │  └───────────────────────────────────────────────────────────┘ │
      │                                                                 │
      │  ┌───────────────────────────────────────────────────────────┐ │
      │  │                                                           │ │
      │  │              FRONTEND APPLICATION                         │ │
      │  │           (React Server Components)                       │ │
      │  │                                                           │ │
      │  │  Pages: /src/app/*                                        │ │
      │  │  Components: /src/components/*                            │ │
      │  │  API Client: /src/lib/payload-api.ts                      │ │
      │  │                                                           │ │
      │  └───────────────────────────────────────────────────────────┘ │
      │                                                                 │
      └────────────────────────────┬────────────────────────────────────┘
                                   │
                                   │ Database Connection (Port 27017)
                                   │
                                   ▼
      ┌─────────────────────────────────────────────────────────────────┐
      │                        MONGODB DATABASE                         │
      │                    Container: prrc-mongodb                      │
      │                      Port: 27017                                │
      │                                                                 │
      │  Stores:                                                        │
      │  - Users (Admins, Researchers)                                  │
      │  - Resumes                                                      │
      │  - Documents (Papers)                                           │
      │  - Events                                                       │
      │  - Media (Files)                                                │
      └─────────────────────────────────────────────────────────────────┘
      ```

      ### Data Flow

      1.  **Public User**: Request -> Nginx -> Next.js (Pages) -> Payload API (Internal) -> MongoDB
      2.  **Admin/Researcher**: Request -> Nginx -> Next.js (Payload Admin UI at `/admin`) -> MongoDB
      3.  **API Calls**: Frontend components use Payload's REST API at `/api/*` or direct imports for server-side operations.

      ## Database Schema

      - **Users**: Role-based access (`admin`, `researcher`).
      - **Resumes**: Linked to users, self-editable by researchers.
      - **Events**: Public calendar events.
      - **Documents**: Research papers with workflow (`draft` -> `pending` -> `published`).
      - **Media**: File storage for resumes and document attachments.


      # Documentation Policy

      This project enforces a strict documentation structure to ensure clarity, maintainability, and consistency across all modules.

      ## Directory Structure

      ### Root Directory

      The root of the workspace must contain:

      - `README.md`: High-level overview of the entire project, listing all modules.
      - `specs/`: Directory for global specifications affecting the whole system.
        - `spec.md`: Global system architecture and requirements.
        - `tasks.md`: Global task tracking.
        - `plan.md`: Global roadmap.

      ### Module Directories (e.g., `prrc-next-app/`, `backend/`)

      Each module must contain its own documentation in the following structure:

      - `README.md`: Module-specific overview, setup, and usage instructions.
      - `CHANGELOG.md`: Record of changes specific to this module.
      - `specs/`: Directory for module-specific documentation.
        - `spec.md`: Detailed technical specification for the module.
        - `tasks.md`: Task tracking for the module.
        - `plan.md`: Roadmap and planning for the module.

      ## Allowed Files

      Only the files listed above are permitted for core documentation.

      - Do not create arbitrary markdown files (e.g., `notes.md`, `ideas.md`) in the root or module roots.
      - Temporary documentation should be consolidated into the appropriate `spec.md` or `plan.md` file.

      ## Maintenance

      - **Update Frequency**: `CHANGELOG.md` must be updated with every significant code change.
      - **Single Source of Truth**: Avoid duplicating information between Root and Module documentation. Root docs should reference Module docs.
