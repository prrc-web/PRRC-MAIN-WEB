                      {office && (
                        <div className="text-white mt-1 mb-2">
                          <i className="fas fa-building mr-2"></i>O: {office}
                        </div>
                      )}

                      {resumeLink && (
                        <button
                          className="btn btn-primary mt-2"
                          onClick={() => window.open(resumeLink, '_blank')}>
                          Resume
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </a>
          </div>
        );
      };

      export default AdminCard;
