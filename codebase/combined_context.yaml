  - path: docker-compose.yml
    content: |
      services:
        # MongoDB Database
        mongodb:
          image: mongo:7
          container_name: prrc-mongodb
          restart: unless-stopped
          environment:
            MONGO_INITDB_DATABASE: prrc
          ports:
            - "27017:27017"
          volumes:
            - mongodb_data:/data/db
          networks:
            - prrc-network
          healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/prrc --quiet
            interval: 10s
            timeout: 5s
            retries: 5

        # Next.js Frontend
        nextjs-frontend:
          build:
            context: ./prrc-next-app
            dockerfile: Dockerfile.dev
          container_name: prrc-nextjs-frontend
          restart: unless-stopped
          # Expose internal port only; nginx will expose externally on 3000
          expose:
            - "3000"
          environment:
            - NEXT_PUBLIC_API_URL=http://localhost:3000
            - NEXT_PUBLIC_API_URL_INTERNAL=http://localhost:3000
            - MONGODB_URI=mongodb://mongodb:27017/prrc
            - PAYLOAD_SECRET=${PAYLOAD_SECRET:-default-secret-change-in-production}
            - PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3000
            - PORT=3000
            - NODE_ENV=development
            - WATCHPACK_POLLING=true
          # volumes:
          # - ./prrc-next-app:/app:cached
          # - /app/node_modules
          # - /app/.next
          networks:
            - prrc-network

        # Nginx reverse proxy to serve frontend + backend on same host:port
        nginx:
          build:
            context: ./nginx
            dockerfile: Dockerfile
          container_name: prrc-nginx
          ports:
            - "3000:80"
          # nginx.conf copied at build time to the image to avoid macOS file lock issues
          depends_on:
            - nextjs-frontend
            - mongodb
          networks:
            - prrc-network
          restart: unless-stopped

      networks:
        prrc-network:
          driver: bridge

      volumes:
        mongodb_data:
          driver: local
        payload_uploads:
          driver: local
