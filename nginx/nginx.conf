events { worker_connections 1024; }

http {
  # Payload CMS backend — admin + API on :3001 (compose service "payload-backend")
  upstream payload_backend {
    server payload-backend:3001;
  }

  # Next.js frontend — public site on :3000 (compose service "nextjs-frontend")
  upstream frontend {
    server nextjs-frontend:3000;
  }

  server {
    listen 80;
    # Replace with your real domain once DNS points here, e.g. wagtaildemo.codered.cloud
    server_name _;
    absolute_redirect off;

    # ---- Payload API (forms, collections) -> backend /api/ ----
    location ^~ /api/ {
      proxy_pass http://payload_backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Payload admin UI -> backend /admin/ (served at /admin-panel/ publicly) ----
    # Maps public /admin-panel/login  ->  backend /admin/login
    location ^~ /admin-panel/ {
      proxy_pass http://payload_backend/admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js frontend (public pages, /staff, login)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support for Next.js HMR
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
