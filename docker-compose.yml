version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: prrc-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: prrc
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - prrc-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/prrc --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Payload CMS Backend
  payload-backend:
    build:
      context: ./payload-backend
      dockerfile: Dockerfile.dev
    container_name: prrc-payload-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/prrc
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-default-secret-change-in-production}
      - PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3001
      - PORT=3001
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./payload-backend/src:/app/src
      - ./payload-backend/public:/app/public
      - ./payload-backend/payload.config.ts:/app/payload.config.ts
      - payload_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - prrc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  nextjs-frontend:
    build:
      context: ./prrc-next-app
      dockerfile: Dockerfile.dev
    container_name: prrc-nextjs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_API_URL_INTERNAL=http://payload-backend:3001
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - ./prrc-next-app/src:/app/src
      - ./prrc-next-app/public:/app/public
      - ./prrc-next-app/components:/app/components
      - ./prrc-next-app/package.json:/app/package.json
    depends_on:
      - payload-backend
    networks:
      - prrc-network

networks:
  prrc-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  payload_uploads:
    driver: local
