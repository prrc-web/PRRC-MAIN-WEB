services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3001"
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - app-network
    command: npm run start

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    depends_on:
      node:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge