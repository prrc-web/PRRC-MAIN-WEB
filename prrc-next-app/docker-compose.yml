version: '3.8'

services:
  node:
    build: .
    # Next.js default dev port is 3000 — mapping 3001 was causing a collision
    # with the canonical Payload backend running on 3001. Use 3000 to run the
    # frontend in its own container.
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/prrc
      - PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3001
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3001
      - PAYLOAD_CONFIG_PATH=payload.config.js
    # NOTE: we intentionally do NOT depend on `mongo` here so `docker compose up`
    # doesn't automatically start a database when you only want to run the
    # frontend. Use `docker compose up --profile db` or `docker compose up mongo`
    # to start the DB if you need it in the same compose stack.
    networks:
      - app-network
    restart: on-failure

  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    # Make mongo optional so `docker compose up` starts only the frontend.
    profiles:
      - db
    networks:
      - app-network
    restart: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node
    networks:
      - app-network
    restart: on-failure

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
